  <text x="1156" y="862" fill="#173557" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Saved / History / Suggestions</text>
  <text x="1156" y="888" fill="#64788F" font-family="Arial, Helvetica, sans-serif" font-size="14">Library and history become lightweight tabs, not dense text walls.</text>

