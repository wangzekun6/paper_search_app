  <text x="1156" y="638" fill="#64788F" font-family="Arial, Helvetica, sans-serif" font-size="14">- matched scene, task, time range</text>
  <text x="1156" y="662" fill="#64788F" font-family="Arial, Helvetica, sans-serif" font-size="14">- one or two snippet-level evidence blocks</text>

