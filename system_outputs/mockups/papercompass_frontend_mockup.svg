  <text x="264" y="252" fill="#173557" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">One search bar, then explainable paper exploration</text>
  <text x="264" y="284" fill="#60738B" font-family="Arial, Helvetica, sans-serif" font-size="16">Turn the current multi-block experience into a focused query workspace with explainable results, filters, and a detail drawer.</text>

