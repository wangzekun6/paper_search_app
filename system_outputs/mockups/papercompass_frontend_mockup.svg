  <text x="1178" y="764" fill="#AA6A15" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Method</text>
  <rect x="1258" y="748" width="102" height="24" rx="12" fill="#EAF7F0"/>
  <text x="1283" y="764" fill="#1E7A50" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Dataset</text>
  <rect x="1370" y="748" width="88" height="24" rx="12" fill="#EAF3FF"/>
  <text x="1392" y="764" fill="#255AA9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Metric</text>
  <text x="1156" y="794" fill="#64788F" font-family="Arial, Helvetica, sans-serif" font-size="14">Keep JSON available, but default to a readable summary view.</text>

